<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title description">
  <title id="title">Awesome Loop</title>
  <desc id="description">A collection about looped Transformers, recurrent depth, and latent reasoning. A diagram shows input passing through a shared Transformer core to output, with a loop that repeats the same core k times.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#3D6FB6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1.5 1.5 L 7 4.5 L 1.5 7.5" fill="none" stroke="#0E7C7B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1278" height="318" rx="14" fill="#F6F8FB" stroke="#E3E8EF" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="75" fill="#8A97A8" font-size="12" font-weight="600" letter-spacing="2.5">A CURATED RESEARCH COLLECTION</text>
    <text x="70" y="148" fill="#1B2A41" font-family="Charter, 'Bitstream Charter', Georgia, serif" font-size="62" font-weight="600">Awesome Loop</text>
    <text x="73" y="192" fill="#52627A" font-size="21">Looped Transformers · Recurrent Depth</text>
    <text x="73" y="224" fill="#52627A" font-size="21">Latent Reasoning</text>
    <path d="M 73 250 H 119" fill="none" stroke="#0E7C7B" stroke-width="3" stroke-linecap="round"/>
    <text x="135" y="255" fill="#8A97A8" font-size="13" letter-spacing="0.5">Shared weights. Iterative computation.</text>

    <path d="M 657 62 V 258" fill="none" stroke="#E3E8EF" stroke-width="1.5"/>
    <text x="716" y="65" fill="#8A97A8" font-size="12" font-weight="600" letter-spacing="2">RECURRENT DEPTH</text>

    <path d="M 1090 162 V 119 Q 1090 96 1067 96 H 877 Q 855 96 855 119 V 140 Q 855 162 877 162 H 883" fill="none" stroke="#0E7C7B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
    <rect x="916" y="81" width="120" height="28" rx="14" fill="#F6F8FB"/>
    <text x="976" y="100" text-anchor="middle" fill="#0E7C7B" font-size="15" font-weight="600">repeat k times</text>

    <rect x="716" y="140" width="92" height="44" rx="10" fill="#FFFFFF" stroke="#D6DFEB" stroke-width="1.5"/>
    <text x="762" y="168" text-anchor="middle" fill="#52627A" font-size="18">Input</text>
    <path d="M 809 162 H 870" fill="none" stroke="#3D6FB6" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-blue)"/>

    <rect x="884" y="125" width="184" height="74" rx="12" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="1.8"/>
    <rect x="884" y="125" width="5" height="74" rx="2.5" fill="#3D6FB6"/>
    <text x="978" y="156" text-anchor="middle" fill="#1B2A41" font-size="21" font-weight="600">Shared core</text>
    <text x="978" y="179" text-anchor="middle" fill="#52627A" font-size="15">Transformer</text>

    <path d="M 1069 162 H 1124" fill="none" stroke="#3D6FB6" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <rect x="1134" y="140" width="93" height="44" rx="10" fill="#FFFFFF" stroke="#D6DFEB" stroke-width="1.5"/>
    <text x="1180.5" y="168" text-anchor="middle" fill="#52627A" font-size="18">Output</text>

    <path d="M 914 222 H 1038" fill="none" stroke="#D6DFEB" stroke-width="1.5"/>
    <circle cx="936" cy="222" r="3.5" fill="#3D6FB6"/>
    <circle cx="976" cy="222" r="3.5" fill="#3D6FB6"/>
    <circle cx="1016" cy="222" r="3.5" fill="#3D6FB6"/>
    <text x="976" y="251" text-anchor="middle" fill="#8A97A8" font-size="14">One core, multiple iterations</text>
  </g>
</svg>
